# GitHub Actions workflow — Generate contribution snake daily
# Output branch: "output"
# Dark snake uses custom pink/purple palette

name: Generate Contribution Snake

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation (dark + light)
        uses: Platane/snk@v3
        with:
          github_user_name: harshitaydv24
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          # Custom palette for dark snake: pink/purple on dark grid
          # Platane/snk v3 supports palette parameter via outputs

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

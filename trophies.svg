  <!-- shine sweep across all trophies -->
  <g clip-path="url(#trophyClip)">
    <rect x="-200" y="0" width="180" height="200" fill="url(#shineGrad)">
      <animate attributeName="x" values="-200;1110" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
